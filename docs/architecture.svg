<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Segoe UI', sans-serif;">
  <title>Climate Lakehouse PE Architecture</title>
  <desc>Medallion architecture: 4 weather stations TXT files flow through Bronze, Silver, Gold layers in DuckDB, feed Prophet for forecasting, and visualize in Power BI.</desc>
  <style>
    .box-bronze { fill: #FAEEDA; stroke: #BA7517; stroke-width: 0.5; }
    .box-silver { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
    .box-gold { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
    .box-purple { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
    .box-blue { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
    .box-coral { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
    .t { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
    .ts { font-size: 12px; fill: #5F5E5A; }
    .arr { stroke: #5F5E5A; stroke-width: 1; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="box-silver" x="40" y="50" width="140" height="60" rx="8"/>
  <text class="t" x="110" y="80" text-anchor="middle">4 Estaciones</text>
  <text class="ts" x="110" y="98" text-anchor="middle">TXT (Davis V.Pro 2)</text>

  <rect class="box-bronze" x="240" y="50" width="140" height="60" rx="8"/>
  <text class="t" x="310" y="80" text-anchor="middle">Bronze</text>
  <text class="ts" x="310" y="98" text-anchor="middle">Parquet particionado</text>

  <rect class="box-silver" x="440" y="50" width="140" height="60" rx="8"/>
  <text class="t" x="510" y="80" text-anchor="middle">Silver</text>
  <text class="ts" x="510" y="98" text-anchor="middle">Limpieza + tipos</text>

  <line x1="180" y1="80" x2="232" y2="80" class="arr" marker-end="url(#arrow)"/>
  <line x1="380" y1="80" x2="432" y2="80" class="arr" marker-end="url(#arrow)"/>
  <path d="M510 110 L510 145 L310 145 L310 175" class="arr" marker-end="url(#arrow)"/>

  <rect class="box-gold" x="190" y="180" width="240" height="80" rx="8"/>
  <text class="t" x="310" y="212" text-anchor="middle">Gold (DuckDB)</text>
  <text class="ts" x="310" y="232" text-anchor="middle">Star schema · 2 dim · 4 fact</text>
  <text class="ts" x="310" y="250" text-anchor="middle">climate.duckdb</text>

  <rect class="box-purple" x="450" y="180" width="180" height="80" rx="8"/>
  <text class="t" x="540" y="212" text-anchor="middle">Prophet (Meta)</text>
  <text class="ts" x="540" y="232" text-anchor="middle">Forecast 30 días</text>
  <text class="ts" x="540" y="250" text-anchor="middle">Bandas confianza 80%</text>

  <line x1="430" y1="220" x2="448" y2="220" class="arr" marker-end="url(#arrow)"/>
  <line x1="448" y1="240" x2="432" y2="240" class="arr" marker-end="url(#arrow)"/>
  <path d="M310 260 L310 295" class="arr" marker-end="url(#arrow)"/>

  <rect class="box-blue" x="100" y="300" width="420" height="100" rx="8"/>
  <text class="t" x="310" y="328" text-anchor="middle">Power BI Desktop</text>
  <text class="ts" x="310" y="350" text-anchor="middle">Conexión ODBC nativa</text>
  <text class="ts" x="310" y="370" text-anchor="middle">39 medidas DAX · 5 páginas</text>
  <text class="ts" x="310" y="390" text-anchor="middle">Tema custom · Star schema</text>

  <rect class="box-coral" x="40" y="430" width="100" height="50" rx="6"/>
  <text class="ts" x="90" y="450" text-anchor="middle" font-weight="500">Pág. 1</text>
  <text class="ts" x="90" y="468" text-anchor="middle">Overview</text>

  <rect class="box-coral" x="160" y="430" width="100" height="50" rx="6"/>
  <text class="ts" x="210" y="450" text-anchor="middle" font-weight="500">Pág. 2</text>
  <text class="ts" x="210" y="468" text-anchor="middle">El Niño</text>

  <rect class="box-coral" x="280" y="430" width="100" height="50" rx="6"/>
  <text class="ts" x="330" y="450" text-anchor="middle" font-weight="500">Pág. 3</text>
  <text class="ts" x="330" y="468" text-anchor="middle">Hídrica</text>

  <rect class="box-coral" x="400" y="430" width="100" height="50" rx="6"/>
  <text class="ts" x="450" y="450" text-anchor="middle" font-weight="500">Pág. 4</text>
  <text class="ts" x="450" y="468" text-anchor="middle">Alertas</text>

  <rect class="box-coral" x="520" y="430" width="100" height="50" rx="6"/>
  <text class="ts" x="570" y="450" text-anchor="middle" font-weight="500">Pág. 5</text>
  <text class="ts" x="570" y="468" text-anchor="middle">Forecast</text>
</svg>
